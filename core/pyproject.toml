[project]
name = "udally-core"
version = "0.1.0"
description = "유달리 — core (Django + Django Ninja)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "dj-database-url>=2.3",
    "django>=5.2,<6",
    "django-ninja>=1.3",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
]
