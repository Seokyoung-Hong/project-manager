{% extends "base.html" %}{% block title %}조직 만들기{% endblock %}
{% block main %}
<div class="card form-card">
  <h1 class="t24">조직 만들기</h1>
  <form method="post" class="stack">{% csrf_token %}
    {% for e in form.non_field_errors %}<div class="error">{{ e }}</div>{% endfor %}
    {% include "_fields.html" %}
    <button class="btn primary">조직 만들기</button>
  </form>
</div>
{% endblock %}
