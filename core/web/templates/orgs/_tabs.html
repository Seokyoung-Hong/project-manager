<div class="page-head"><h1 class="t24">{{ org.name }}</h1></div>
<nav class="tabs org-tabs" aria-label="조직 메뉴">
  <a href="{% url 'org_detail' org.pk %}" {% if tab == "overview" %}aria-current="page"{% endif %}>개요</a>
  <a href="{% url 'org_teams' org.pk %}" {% if tab == "teams" %}aria-current="page"{% endif %}>팀</a>
  <a href="{% url 'org_capacity' org.pk %}" {% if tab == "capacity" %}aria-current="page"{% endif %}>사람별 할 일 양</a>
  <a href="{% url 'org_roadmap' org.pk %}" {% if tab == "roadmap" %}aria-current="page"{% endif %}>로드맵</a>
  <!-- V2-05: 회의록 -->
  <a href="{% url 'org_governance' org.pk %}" {% if tab == "governance" %}aria-current="page"{% endif %}>업무 규칙</a>
  <a href="{% url 'org_docs' org.pk %}" {% if tab == "docs" %}aria-current="page"{% endif %}>문서</a>
  <a href="{% url 'org_notes' org.pk %}" {% if tab == "notes" %}aria-current="page"{% endif %}>회의록</a>
  <a href="{% url 'org_transcribe' org.pk %}" {% if tab == "transcribe" %}aria-current="page"{% endif %}>전사</a>
  {% if github_enabled and org.github %}<a href="{% url 'org_issues' org.pk %}" {% if tab == "issues" %}aria-current="page"{% endif %}>이슈</a>{% endif %}
  {# 설정은 모든 구성원에게 보인다 — 내 정보(조직 표시 이름·구성원 정보)가 첫 탭이다. GitHub·Discord는 설정 → 연동(IMPL-PLAN-14 §5) #}
  <a href="{% url 'org_settings' org.pk %}" {% if tab == "settings" or tab == "github" or tab == "discord" %}aria-current="page"{% endif %}>설정</a>
</nav>
