<form class="stack" hx-post="{% url 'task_split' task.pk %}" hx-target="#dialog" hx-swap="innerHTML">
  <h2 class="t20">사람별로 나누기</h2>
  <p class="muted t13">담당자는 한 명입니다. 고른 사람마다 {{ task.number }}의 설명·완료 조건·체크리스트(미완료로)·링크·문서 연결·기한을 복사한 태스크를 만들어 같은 계열로 묶습니다. 역할을 적으면 제목에 붙습니다. {{ task.number }}의 체크리스트는 만든 태스크 목록으로 바뀝니다.</p>
  <input type="hidden" name="idem" value="{{ idem }}">
  <fieldset class="stack">
    <legend class="t13">맡을 사람 (2~10명)</legend>
    {% for r in rows %}<div class="row"><label class="check"><input type="checkbox" name="assignee" value="{{ r.user.pk }}"{% if r.checked %} checked{% endif %}> {{ r.user.display_name }}</label><input class="input" name="role_{{ r.user.pk }}" value="{{ r.role }}" placeholder="맡은 역할 (선택)" aria-label="{{ r.user.display_name }}의 역할"></div>{% endfor %}
  </fieldset>
  <label class="field">제목 규칙<input class="input" name="title_pattern" value="{{ pattern }}"></label>
  <p class="muted t13">{title}은 원래 제목, {name}은 이름(역할)입니다.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <div class="row">
    <button class="btn primary">나누기</button>
    <button type="button" class="btn" data-action="close-dialog">취소</button>
  </div>
</form>
