{% if reject_pending %}
<form class="stop-box" hx-post="{% url 'task_status' task.pk %}" hx-target="#panel" hx-swap="innerHTML">
  <input type="hidden" name="version" value="{{ task.version }}">
  <input type="hidden" name="from" value="panel">
  <input type="hidden" name="status" value="{{ reject_pending }}">
  <label class="label" for="stop-reason-{{ task.pk }}">반려 사유</label>
  <textarea id="stop-reason-{{ task.pk }}" class="textarea" name="reason" rows="2" data-md data-toolbar="bottom" data-focus placeholder="무엇을 고쳐야 하나요? (필수)">{{ stop_draft }}</textarea>
  {% if stop_error %}<div class="error">{{ stop_error }}</div>{% endif %}
  <div class="row">
    <button class="btn sm primary">반려</button>
    <button type="button" class="btn sm" hx-get="{% url 'task_panel' task.pk %}" hx-target="#panel" hx-swap="innerHTML">취소</button>
  </div>
</form>
{% else %}
<form class="stop-box" hx-post="{% url 'task_stop_reason' task.pk %}" hx-target="#panel" hx-swap="innerHTML">
  <input type="hidden" name="version" value="{{ task.version }}">
  {% if block_pending %}<input type="hidden" name="confirm_block" value="1">{% endif %}
  <label class="label" for="stop-reason-{{ task.pk }}">{% if block_pending %}막힘 사유{% elif task.is_blocked %}막힌 이유{% else %}멈춘 이유{% endif %}</label>
  <textarea id="stop-reason-{{ task.pk }}" class="textarea" name="reason" rows="2" data-md data-toolbar="bottom"{% if block_pending %} data-focus{% endif %}
            placeholder="{% if block_pending or task.is_blocked %}무엇 때문에 막혔나요? (필수){% else %}왜 잠시 멈췄나요? (선택){% endif %}">{{ stop_draft }}</textarea>
  {% if stop_error %}<div class="error">{{ stop_error }}</div>{% endif %}
  <div class="row">
    <button class="btn sm primary">{% if block_pending %}막힘으로 변경{% else %}사유 저장{% endif %}</button>
    {% if block_pending %}<button type="button" class="btn sm" hx-get="{% url 'task_panel' task.pk %}" hx-target="#panel" hx-swap="innerHTML">취소</button>{% endif %}
  </div>
</form>
{% endif %}
