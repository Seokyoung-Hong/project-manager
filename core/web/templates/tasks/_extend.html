<form class="stop-box" hx-post="{% url 'task_extend' task.pk %}" hx-target="#panel" hx-swap="innerHTML">
  <input type="hidden" name="version" value="{{ task.version }}">
  <label class="field">{% if task.due_date %}새 기한{% else %}기한{% endif %}<input class="input" type="date" name="due_date" min="{{ extend_min|date:'Y-m-d' }}" required></label>
  <label class="field">{% if task.due_date %}기한 연장 사유{% else %}기한 지정 사유{% endif %}<input class="input" name="reason" placeholder="기한 변경 사유를 적어 주세요. (필수)" required{% if ai_on %} data-ai="task.extend_reason" data-ai-target="task:{{ task.pk }}"{% endif %}></label>
  {% if extend_error %}<div class="error">{{ extend_error }}</div>{% endif %}
  <button class="btn sm primary">{% if task.due_date %}기한 연장{% else %}기한 저장{% endif %}</button>
</form>
