{# 문서·회의록 본문 편집기(doc-tiptap.js, 서식 줄은 md-field.js 공용). 넘길 값: save_url, version, body. 같은 .card 안의 [data-note-field]도 함께 저장한다. #}
<form id="doc-form" method="post" action="{{ save_url }}">{% csrf_token %}
  <input type="hidden" name="field" value="body_md">
  <input type="hidden" name="version" value="{{ version }}">
  <div class="md-edit-row">
    <button type="button" class="btn sm md-edit-start" aria-controls="doc-body">본문 편집</button>
    <span class="muted t13">본문을 누르면 바로 씁니다. 입력을 멈추면 0.8초 뒤 저장됩니다. Esc로 편집을 마칩니다.</span>
  </div>
  <div class="mdf" data-toolbar="top">{# 서식 줄은 md-field.js(공용)가 칸 위에 붙인다 #}
    <div id="doc-body" class="md-editor md" data-url="{{ save_url }}" data-version="{{ version }}">
      <textarea class="md-src textarea" name="value" rows="16" aria-label="본문 Markdown">{{ body }}</textarea>
    </div>
  </div>
  <noscript><button class="btn sm primary">저장</button></noscript>
</form>
