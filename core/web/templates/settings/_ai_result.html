{# [연결 시험]·[모델 불러오기] 결과(IMPL-PLAN-12 §7.5). 오류는 코드 문구만, 응답 본문은 내지 않는다. #}
{% if error %}<p class="error" role="alert">⚠ {{ error }}</p>
{% else %}<p class="muted t12">연결되었습니다. 모델 {{ count }}개를 확인했습니다.{% if list_id %} 모델 입력 칸에서 선택할 수 있습니다.{% endif %}</p>{% endif %}{# COPY:assist_test_ok #}
{% if list_id %}<datalist id="{{ list_id }}" hx-swap-oob="true">{% for m in models %}<option value="{{ m }}"></option>{% endfor %}</datalist>{% endif %}
