{% extends "base.html" %}{% block title %}가입{% endblock %}
{% block auth %}
<h1 class="t24">가입</h1>
<form method="post" class="stack">{% csrf_token %}
  {% for e in form.non_field_errors %}<div class="error">{{ e }}</div>{% endfor %}
  {% include "_fields.html" %}
  <button class="btn primary">가입</button>
</form>
{% if github_enabled %}<a class="btn" href="{% url 'github_login' %}?next={{ request.GET.next|urlencode }}">GitHub로 가입</a>{% endif %}
<p class="t13">이미 계정이 있으면 <a href="{% url 'login' %}">로그인</a>하세요.</p>
{% endblock %}
