# 컨테이너 로그 회전 = 개인정보 처리방침의 "서버 접속 로그 90일"을 지키는 근사치.
# ponytail: json-file은 날짜 회전이 없고 크기·개수로만 돈다. 2m x 3 = 서비스당 최대 약 6MB(gunicorn 접속 줄 약 200B면 약 3만 건).
#   90일 평균이 하루 330건 이상이면 90일 안에 밀려난다. 그보다 한산하면 90일을 넘겨 남을 수 있다 -> 매월 `docker compose up -d --force-recreate`
#   (컨테이너를 새로 만들면 이전 로그 파일이 지워진다, docs/OPERATIONS-DEPLOYMENT.md). 많이 몰리면 90일보다 일찍 사라진다(장애 추적은 그 한도).
x-logging: &logging
  driver: json-file
  options: {max-size: "2m", max-file: "3"}

# web·purge·realtime이 같은 core 이미지를 쓴다. 스킬 묶음 제공(/skills/udally-skills.zip)에 저장소 skills/가 필요하다.
x-core-build: &core-build
  context: ./core
  additional_contexts: {skills: ./skills}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped     # 없으면 호스트 재부팅 뒤 db만 내려가 web이 migrate에서 크래시 루프한다.
    logging: *logging
    ports:
      - "127.0.0.1:5432:5432"   # 로컬 개발·테스트용. 서버에서는 이 두 줄을 지운다.

  web:
    build: *core-build
    env_file: .env               # 봇 토큰·CORE_TOKEN은 여기 없다(.env.discord에만 있다)
    environment:
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD:-pm}@db:5432/pm
      MEDIA_ROOT: /data/media      # 첨부 파일. 백업(scripts/backup.sh)이 이 볼륨도 담는다
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    ports:
      # 0.0.0.0의 WEB_PORT(.env, 기본 8000). 다른 장비의 리버스 프록시(NginxProxyManager)가 여기로 붙는다.
      # 방화벽에서 프록시 장비 IP만 그 포트를 열어 둔다 — 직접 오는 요청은 평문 HTTP다.
      # cloudflared로만 공개한다면 WEB_PORT를 "127.0.0.1:8000"으로 둔다.
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      # migrate·collectstatic이 끝나고 gunicorn이 받기 시작해야 통과한다. 봇·mcp는 이걸 기다린다.
      # TCP 연결만 본다. gunicorn은 migrate가 끝난 뒤에야 듣기 시작한다. HTTP로 물으면 Host가
      # ALLOWED_HOSTS에 없어(127.0.0.1) 400이 나 영영 unhealthy가 된다.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  purge:                         # 주기 작업: GitHub 보정(github_reconcile) 5분, 보관 기간 정리(purge_expired) 하루. web과 같은 이미지(새 이미지·cron 없음)
    build: *core-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD:-pm}@db:5432/pm
    entrypoint: ["sh", "-c"]     # web의 entrypoint.sh(migrate·gunicorn)를 건너뛴다
    # 실행기: ops/management/commands/run_periodic.py(한 작업이 실패해도 루프는 산다).
    #   작업별 결과·실패는 `docker compose logs purge`에 남는다.
    command: ["exec python manage.py run_periodic"]
    depends_on:
      web:
        condition: service_healthy   # migrate가 끝난 뒤에 돈다
    restart: unless-stopped
    logging: *logging

  realtime:                      # 실시간 반영(/rt/: WebSocket·SSE·폴링). web과 같은 이미지, 진입점만 다르다
    build: *core-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD:-pm}@db:5432/pm
      DB_CONN_MAX_AGE: "0"   # 요청 스레드마다 연결을 남기지 않는다(동시 연결 수는 rt_asgi의 처리 상한이 묶는다)
    # web의 entrypoint.sh(migrate·collectstatic)를 건너뛴다. 프로세스 하나가 직접 LISTEN하므로 --workers 1 고정.
    # 접속 로그는 web과 같이 끈다(처리방침: 앱에는 IP를 남기지 않는다).
    entrypoint: ["uvicorn", "config.rt_asgi:app", "--host", "0.0.0.0", "--port", "8082", "--workers", "1",
                 "--no-access-log", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      web:
        condition: service_healthy   # migrate(트리거 설치)가 끝난 뒤에 뜬다
    restart: unless-stopped
    logging: *logging
    ports:
      # 앞단(NPM)이 ^~ /rt/ 를 여기로 보낸다. 방화벽은 web 포트와 같이 프록시 장비만 연다.
      - "${RT_PORT:-8082}:8082"

  discord:                       # 발송(60초 틱): 마감 DM·주간 보고
    profiles: ["discord"]        # DISCORD_BOT_TOKEN 없이는 기동에 실패한다 → 기본에서 뺀다
    build: ./discord_service
    env_file: .env.discord
    environment:
      CORE_URL: http://web:8000
      DB_PATH: /data/discord.sqlite
    volumes:
      - discord_data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  discord-bot:                   # 수신(게이트웨이): DM 평문 명령. 같은 이미지, 리스너만 돈다
    profiles: ["discord"]
    build: ./discord_service
    env_file: .env.discord
    environment:
      CORE_URL: http://web:8000
      DISCORD_CONTROL_PORT: "8081"
      DB_PATH: /data/bot.sqlite      # 채널 자동 관리가 넣은 덮어쓰기 기록. 발송 프로세스의 파일과 따로 쓴다
      VOICE_URL: http://discord-voice:8082   # 회의 명령이 음성 서비스를 부른다(VOICE_CONTROL_SECRET은 .env.discord)
    command: ["python", "-m", "discord_service", "bot"]
    volumes:
      - discord_bot_data:/data
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "8081"                    # MCP 내부 채널 관리 브리지. 호스트 포트로 공개하지 않는다.
    restart: unless-stopped
    logging: *logging

  discord-voice:                 # 음성(같은 봇 토큰의 두 번째 게이트웨이 세션): 회의 녹음·전사. docs/IMPL-PLAN-9-parallel.md
    profiles: ["discord"]        # 명령·인터랙션은 discord-bot만 받는다. 이 서비스는 명령을 등록하지 않는다
    build: ./discord_gateway
    env_file: .env.discord
    environment:
      CORE_URL: http://web:8000
      VOICE_CONTROL_PORT: "8082"
      VOICE_DATA: /data
      SITE_URL: ${SITE_URL:-}      # 시작 고지의 처리방침 링크
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - discord_voice_data:/data   # 녹음 구간(7일 뒤 스스로 지운다). 백업에 넣지 않는다
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "8082"                    # discord-bot만 부른다. 호스트 포트로 공개하지 않는다.
    # LXC 512MB의 가용분(≈190MB) 아래로 둔다. 넘치면 db·web 대신 이 컨테이너가 먼저 죽는다(재시도 큐가 이어 받는다)
    mem_limit: 384m
    oom_score_adj: 1000
    logging: *logging
    restart: unless-stopped

  mcp:                           # 선택 확장: claude.ai 웹·모바일용 원격 커넥터. Claude Code는 skills/로 core API를 직접 부른다
    profiles: ["mcp"]            # 켜려면 --profile mcp 또는 .env의 COMPOSE_PROFILES=mcp
    build: ./mcp_server
    environment:
      CORE_URL: http://web:8000
      DISCORD_CONTROL_URL: http://discord-bot:8081
      PORT: "8080"
      # core의 공개 주소(= OAuth 인가 서버). 비면 OAuth를 광고하지 않고 토큰만 받는다.
      AUTH_SERVER_URL: ${SITE_URL:-}
      # 앞단 프록시를 거치면 Host가 그 도메인이라 SDK가 421로 막는다. .env에서 도메인을 넣는다.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    ports:
      - "${MCP_PORT:-127.0.0.1:8080}:8080"   # 기본은 루프백만. 밖에 공개하려면 .env에서 포트만 쓴다

  frps:                          # 전사 서버(NAT 뒤 PC) 중계. NPM stt.sio2.kr → 7080, 같은 호스트 /~!frp → 7000(frpc 제어 websocket)
    profiles: ["relay"]          # 켜려면 --profile relay 또는 COMPOSE_PROFILES에 relay. .env의 FRP_TOKEN 필수
    image: fatedier/frps:v0.71.0
    # 전사 응답이 60초를 넘을 수 있어 응답 헤더 대기를 300초로 둔다(NPM client_body_timeout과 같게)
    environment:
      FRP_TOKEN: ${FRP_TOKEN:-}
    # 토큰이 비면 인증 없이 열리므로 기동을 거부한다(${FRP_TOKEN:?}는 프로필을 꺼도 compose 전체를 막아 쓰지 않는다)
    entrypoint: ["sh", "-c", '[ -n "$$FRP_TOKEN" ] || { echo "FRP_TOKEN 없음" >&2; exit 1; }; exec frps -p 7000 --vhost-http-port 7080 --vhost-http-timeout 300 -t "$$FRP_TOKEN"']
    ports:
      - "7000:7000"
      - "7080:7080"
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  cloudflared:
    profiles: ["tunnel"]         # TUNNEL_TOKEN 없이는 기동에 실패한다 → 기본에서 뺀다
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
      - mcp
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  media_data:
  discord_data:
  discord_bot_data:
  discord_voice_data:
