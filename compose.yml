services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped     # 없으면 호스트 재부팅 뒤 db만 내려가 web이 migrate에서 크래시 루프한다.
    ports:
      - "127.0.0.1:5432:5432"   # 로컬 개발·테스트용. 서버에서는 이 두 줄을 지운다.

  web:
    build: ./core
    env_file: .env               # 봇 토큰·CORE_TOKEN은 여기 없다(.env.discord에만 있다)
    environment:
      DATABASE_URL: postgres://pm:${POSTGRES_PASSWORD:-pm}@db:5432/pm
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # 0.0.0.0의 WEB_PORT(.env, 기본 8000). 다른 장비의 리버스 프록시(NginxProxyManager)가 여기로 붙는다.
      # 방화벽에서 프록시 장비 IP만 그 포트를 열어 둔다 — 직접 오는 요청은 평문 HTTP다.
      # cloudflared로만 공개한다면 WEB_PORT를 "127.0.0.1:8000"으로 둔다.
      - "${WEB_PORT:-8000}:8000"

  discord:                       # 발송(60초 틱): 마감 DM·주간 보고
    profiles: ["discord"]        # DISCORD_BOT_TOKEN 없이는 기동에 실패한다 → 기본에서 뺀다
    build: ./discord_service
    env_file: .env.discord
    environment:
      CORE_URL: http://web:8000
      DB_PATH: /data/discord.sqlite
    volumes:
      - discord_data:/data
    depends_on:
      - web
    restart: unless-stopped

  discord-bot:                   # 수신(게이트웨이): DM 평문 명령. 같은 이미지, 리스너만 돈다
    profiles: ["discord"]
    build: ./discord_service
    env_file: .env.discord
    environment:
      CORE_URL: http://web:8000
      DISCORD_CONTROL_PORT: "8081"
    command: ["python", "-m", "discord_service", "bot"]
    depends_on:
      - web
    # 볼륨 없음: 리스너는 SQLite를 열지 않는다(발송 프로세스가 단일 writer로 남는다).
    expose:
      - "8081"                    # MCP 내부 채널 관리 브리지. 호스트 포트로 공개하지 않는다.
    restart: unless-stopped

  mcp:
    build: ./mcp_server
    environment:
      CORE_URL: http://web:8000
      DISCORD_CONTROL_URL: http://discord-bot:8081
      PORT: "8080"
      # core의 공개 주소(= OAuth 인가 서버). 비면 OAuth를 광고하지 않고 토큰만 받는다.
      AUTH_SERVER_URL: ${SITE_URL:-}
      # 앞단 프록시를 거치면 Host가 그 도메인이라 SDK가 421로 막는다. .env에서 도메인을 넣는다.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    depends_on:
      - web
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-127.0.0.1:8080}:8080"   # 기본은 루프백만. 밖에 공개하려면 .env에서 포트만 쓴다

  cloudflared:
    profiles: ["tunnel"]         # TUNNEL_TOKEN 없이는 기동에 실패한다 → 기본에서 뺀다
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
      - mcp
    restart: unless-stopped

volumes:
  pgdata:
  discord_data:
