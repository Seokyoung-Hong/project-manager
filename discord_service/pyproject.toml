[project]
name = "sandol-discord"
version = "0.1.0"
description = "산돌이 태스크 — Discord 알림 서비스"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    # 게이트웨이(WebSocket) 프로토콜: 하트비트·RESUME·close code 처리를 직접 쓰지 않는다.
    "discord.py>=2.4,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
