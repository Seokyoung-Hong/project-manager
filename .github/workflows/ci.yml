name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.dc.html"
      - "design-concepts/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.dc.html"
      - "design-concepts/**"

# 같은 브랜치에 연달아 push하면 앞선 실행을 취소하고 마지막 것만 돌린다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [core, discord_service, mcp_server]
    defaults:
      run:
        working-directory: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
