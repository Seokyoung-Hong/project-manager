[project]
name = "udally-mcp"
version = "0.1.0"
description = "유달리 — MCP 서버"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.10,<2",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
